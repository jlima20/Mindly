<ion-content class="login-content">

  <ion-button
    fill="clear"
    routerLink="/home"
    class="home-button">
    Voltar para Home
  </ion-button>

  <main class="login-box">

    <h2>Login</h2>

    <ion-text *ngIf="errorMessage" color="danger" class="error-message">
      {{ errorMessage }}
    </ion-text>

    <ion-item>
      <ion-input
        [(ngModel)]="email"
        placeholder="Email"
        type="email">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        [(ngModel)]="senha"
        placeholder="Senha"
        type="password">
      </ion-input>
    </ion-item>

    <ion-button
      expand="block"
      (click)="entrar()"
      [disabled]="!isFormValid() || isLoading"
      class="login-button">
      {{ isLoading ? 'Entrando...' : 'Entrar' }}
    </ion-button>

    <p class="forgot-link" routerLink="/esqueci-senha">
      Esqueceu sua senha?
    </p>

    <p class="register-link" routerLink="/register">
      Cadastre-se
    </p>

  </main>

  <p class="footer-text">
    Seus dados são seguros e confidenciais
  </p>

</ion-content>
