<ion-content class="register-content">

  <h2>Cadastro</h2>

  <ion-text *ngIf="errorMessage" color="danger" class="error-message">
    {{ errorMessage }}
  </ion-text>

  <div class="form-card">

    <ion-item>
      <ion-input [(ngModel)]="formData.nome" placeholder="Nome"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="formData.sobrenome" placeholder="Sobrenome"></ion-input>
    </ion-item>

    <div class="form-row">
      <ion-item>
        <ion-input
          [(ngModel)]="formData.cpf"
          (ionInput)="formatarCPF($event)"
          maxlength="14"
          placeholder="CPF">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [(ngModel)]="formData.dataNascimento"
          (ionInput)="formatarData($event)"
          maxlength="10"
          placeholder="Nascimento">
        </ion-input>
      </ion-item>
    </div>

    <div class="form-row">
      <ion-item>
        <ion-input
          [(ngModel)]="formData.telefone"
          (ionInput)="formatarTelefone($event)"
          maxlength="15"
          placeholder="Telefone">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [(ngModel)]="formData.cep"
          (ionInput)="formatarCEP($event)"
          (ionBlur)="buscarCep()"
          maxlength="9"
          placeholder="CEP">
        </ion-input>
      </ion-item>
    </div>

    <ion-item>
      <ion-input [(ngModel)]="formData.email" placeholder="Email" type="email"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="formData.senha" placeholder="Senha" type="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="confirmarSenha" placeholder="Confirmar senha" type="password"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="formData.endereco" placeholder="Endereço"></ion-input>
    </ion-item>

    <ion-item>
      <ion-input [(ngModel)]="formData.complemento" placeholder="Complemento"></ion-input>
    </ion-item>

    <ion-item>
      <ion-select [(ngModel)]="formData.tipoUsuario" placeholder="Tipo de usuário">
        <ion-select-option value="paciente">Paciente</ion-select-option>
        <ion-select-option value="psicologo">Psicólogo</ion-select-option>
      </ion-select>
    </ion-item>

    <ng-container *ngIf="formData.tipoUsuario === 'psicologo'">

      <ion-item>
        <ion-input
          [(ngModel)]="formData.whatsapp"
          placeholder="WhatsApp">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [(ngModel)]="formData.instagram"
          placeholder="Instagram">
        </ion-input>
      </ion-item>

    </ng-container>

    <ion-button
      expand="block"
      (click)="cadastrar()"
      [disabled]="!isFormValid() || isLoading"
      class="register-button">
      {{ isLoading ? 'Cadastrando...' : 'Criar conta' }}
    </ion-button>

  </div>

  <p routerLink="/login" class="login-link">
    Já tem conta? Faça login
  </p>

  <p class="footer-text">
    Seus dados são seguros e confidenciais
  </p>

</ion-content>
